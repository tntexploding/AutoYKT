[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoykt"
version = "0.2.0"
description = "Rain Classroom protocol service with timely reminders and AI answers"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = {file = "LICENSE"}
dependencies = [
  "aiohttp>=3.9,<4",
  "jinja2>=3.1,<4",
  "openai>=1.30,<3",
  "Pillow>=10.0,<13",
  "pydantic>=2.5,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
desktop = [
  "mss>=9.0,<11",
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "pyautogui>=0.9,<1",
  "python-telegram-bot>=21,<23",
  "rapidocr-onnxruntime>=1.3,<2",
]
dev = [
  "pyink>=24.3,<26",
  "pylint>=3.2,<5",
  "pyright>=1.1,<2",
]

[project.scripts]
autoykt = "autoykt.cli:main"
autoykt-server = "autoykt.server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "third_party/*.txt"]

[tool.setuptools.package-data]
"autoykt.resources" = ["*.yaml"]

[tool.pylint.main]
py-version = "3.10"
source-roots = ["src"]

[tool.pylint.format]
max-line-length = 80

[tool.pylint.basic]
good-names = ["x", "y"]

[tool.pylint.design]
max-args = 10
max-attributes = 25
max-locals = 20
max-positional-arguments = 8

[tool.pylint.messages_control]
disable = ["too-few-public-methods"]

[tool.pyink]
line-length = 80
pyink-indentation = 4
target-version = ["py310"]
